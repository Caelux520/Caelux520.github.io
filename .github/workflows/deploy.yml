# ============================================================
#  🚀 GitHub Pages 自动部署（对应优化：一键发布~♡）
#  推送 main 分支 / 手动触发 都会：npm ci → npm run build → 发布到 GitHub Pages
#  ⚠️ 首次使用前：仓库 Settings → Pages → Build and deployment
#     → Source 选「GitHub Actions」，保证 Pages 域 = Caelux520.github.io~♡
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 必需的权限（缺这几行会部署失败~♡）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check with Astro
        run: npm run check

      - name: Build with Astro
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
